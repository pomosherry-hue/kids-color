<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>第01课 · 老人指导卡</title>
<style>
  body { font-family: "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif; background:#fff8ef; color:#2a221c; margin:0; }
  .page { max-width: 720px; margin: 0 auto; padding: 24px 18px 40px; }
  h1 { font-size: 28px; margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; background:#fff; }
  td, th { border: 1px solid #eadfce; padding: 10px; text-align: left; vertical-align: top; }
  th { background: #fff1e4; }
  .box { background:#fff; border:1px solid #eadfce; border-radius:12px; padding:12px 14px; margin:12px 0; }
</style>
</head>
<body>
<div class="page">
  <h1>第01课指导卡</h1>
  <p>红色遇见黄色 · 给农村家庭图书馆的老人 · 大约5分钟</p>
  <div class="box">
    <b>要准备：</b>红颜料、黄颜料、白纸、一把小笔、一小碟水。没有颜料，就用红的和黄的纸或水果。
  </div>
  <table>
    <tr><th>顺序</th><th>你做什么</th><th>你说什么</th></tr>
    <tr><td>1</td><td>打开第01课，停在第一张</td><td>先猜。红和黄碰在一起会变成什么？</td></tr>
    <tr><td>2</td><td>让孩子分开涂红和黄</td><td>先不要混。哪一块更亮？</td></tr>
    <tr><td>3</td><td>看孩子在中间混色</td><td>橙色出来了吗？</td></tr>
    <tr><td>4</td><td>请孩子调出三种橙</td><td>哪一块更红？哪一块更黄？</td></tr>
    <tr><td>5</td><td>读今天的秘密</td><td>名字一样，样子可以不一样。</td></tr>
    <tr><td>6</td><td>布置回家任务</td><td>找一件偏橙的东西，看它更像红还是更像黄。</td></tr>
  </table>
  <div class="box">做完的样子：纸上有红、黄，和至少两块不一样的橙。孩子能指出“更红的橙”和“更黄的橙”。</div>
  <p>色彩观察学院 · 晨霞子</p>
</div>
</body>
</html>
