<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>第32课 · 调一盘今天的土地 · 中 / EN</title>
<style>
  body { margin: 0; background: #111; color: #fff8ef; font-family: "PingFang SC","Noto Sans SC",sans-serif; }
  .top { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  a { color: #f2c14e; text-decoration: none; font-size: 16px; }
  .langs { display: flex; gap: 8px; }
  .langs button {
    background: #333; color: #fff; border: 1px solid #555; border-radius: 8px;
    padding: 6px 14px; font-size: 15px; cursor: pointer;
  }
  .langs button.active { background: #f2c14e; color: #111; border-color: #f2c14e; font-weight: 700; }
  .stage { position: relative; width: 100%; max-width: 480px; margin: 0 auto; }
  video { width: 100%; display: block; background: #000; }
  .subs {
    position: absolute;
    left: 8%;
    right: 8%;
    bottom: 12%;
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }
  .subs span {
    display: inline-block;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 15px;
    line-height: 1.4;
    padding: 6px 10px;
    border-radius: 8px;
    max-width: 100%;
  }
  .hint { text-align: center; font-size: 13px; color: #aaa; padding: 8px; }
</style>
</head>
<body>
<div class="top">
  <a href="index.html">← 返回</a>
  <div class="langs">
    <button id="btn-zh" class="active">中文</button>
    <button id="btn-en">English</button>
  </div>
</div>
<div class="stage">
  <video id="v" controls playsinline preload="metadata" poster="lesson-32.jpg">
    <source id="src" src="lesson-32.mp4" type="video/mp4">
  </video>
  <div class="subs" id="subs"></div>
</div>
<div class="hint">点击按钮切换语言（音轨 + 字幕）</div>
<script>
const video = document.getElementById('v');
const src = document.getElementById('src');
const subs = document.getElementById('subs');
const btnZh = document.getElementById('btn-zh');
const btnEn = document.getElementById('btn-en');
let currentLang = 'zh';
let cues = { zh: [], en: [] };

async function loadVtt(url) {
  const res = await fetch(url);
  const text = await res.text();
  const blocks = text.split(/\n\n+/).slice(1);
  const list = [];
  for (const b of blocks) {
    const lines = b.trim().split('\n');
    if (lines.length < 2) continue;
    const time = lines[0].includes('-->') ? lines[0] : lines[1];
    const textLines = lines.slice(time === lines[0] ? 1 : 2);
    const [start, end] = time.split('-->').map(s => s.trim());
    list.push({
      start: toSec(start),
      end: toSec(end),
      text: textLines.join('<br>')
    });
  }
  return list;
}
function toSec(t) {
  const p = t.replace(',', '.').split(':');
  if (p.length === 3) return (+p[0])*3600 + (+p[1])*60 + (+p[2]);
  if (p.length === 2) return (+p[0])*60 + (+p[1]);
  return +p[0] || 0;
}

async function init() {
  cues.zh = await loadVtt('lesson-32-zh.vtt');
  cues.en = await loadVtt('lesson-32-en.vtt');
  updateSubs();
}

function updateSubs() {
  const t = video.currentTime || 0;
  const list = cues[currentLang] || [];
  const hit = list.find(c => t >= c.start && t < c.end);
  subs.innerHTML = hit ? `<span>${hit.text}</span>` : '';
}

function setLang(lang) {
  if (lang === currentLang) return;
  const t = video.currentTime || 0;
  const playing = !video.paused;
  btnZh.classList.toggle('active', lang === 'zh');
  btnEn.classList.toggle('active', lang === 'en');
  var file = (lang === 'en') ? 'lesson-32-en.mp4' : 'lesson-32.mp4';
  var url = (window.kidsCloudSrc && window.kidsCloudSrc(file)) || file;
  src.src = url;
  video.src = url;
  video.load();
  if (window.kidsCloudAttach) window.kidsCloudAttach(video, file);
  currentLang = lang;
  const onReady = () => {
    video.currentTime = Math.min(t, (video.duration || 999) - 0.3);
    if (playing) video.play().catch(()=>{});
    video.removeEventListener('loadeddata', onReady);
  };
  video.addEventListener('loadeddata', onReady);
}

btnZh.addEventListener('click', () => setLang('zh'));
btnEn.addEventListener('click', () => setLang('en'));
video.addEventListener('timeupdate', updateSubs);
video.addEventListener('seeked', updateSubs);
init();
</script>
<script src="cloud-media.js"></script>
</body>
</html>
