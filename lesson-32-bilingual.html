<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>第32课 · 调一盘今天的土地 · 中 / EN</title>
<style>
  body { margin: 0; background: #111; color: #fff8ef; font-family: "PingFang SC","Noto Sans SC",sans-serif; }
  .top { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  a { color: #f2c14e; text-decoration: none; font-size: 16px; }
  .langs { display: flex; gap: 8px; }
  .langs button {
    background: #333; color: #fff; border: 1px solid #555; border-radius: 8px;
    padding: 6px 14px; font-size: 15px; cursor: pointer;
  }
  .langs button.active { background: #f2c14e; color: #111; border-color: #f2c14e; font-weight: 700; }
  video { width: 100%; max-width: 480px; display: block; margin: 0 auto; background: #000; }
  .hint { text-align: center; font-size: 13px; color: #aaa; padding: 8px; }

  /* Better looking subtitles */
  video::cue {
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    font-size: 18px;
    font-family: "PingFang SC", "Noto Sans SC", sans-serif;
    line-height: 1.4;
    padding: 4px 8px;
    border-radius: 6px;
  }
  video::cue(b) { font-weight: 700; }
</style>
</head>
<body>
<div class="top">
  <a href="index.html">← 返回</a>
  <div class="langs">
    <button id="btn-zh" class="active" onclick="setLang('zh')">中文</button>
    <button id="btn-en" onclick="setLang('en')">English</button>
  </div>
</div>
<video id="v" controls playsinline preload="metadata" poster="lesson-32.jpg" crossorigin="anonymous">
  <source id="src" src="lesson-32.mp4" type="video/mp4">
  <track id="track-zh" kind="subtitles" src="lesson-32-zh.vtt" srclang="zh" label="中文" default>
  <track id="track-en" kind="subtitles" src="lesson-32-en.vtt" srclang="en" label="English">
</video>
<div class="hint">点击按钮切换语言（音轨 + 字幕）</div>
<script>
const video = document.getElementById('v');
const src = document.getElementById('src');
let currentLang = 'zh';
let savedTime = 0;
let wasPlaying = false;

function setLang(lang) {
  if (lang === currentLang) return;
  savedTime = video.currentTime || 0;
  wasPlaying = !video.paused;

  document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');

  // Switch video source
  src.src = (lang === 'en') ? 'lesson-32-en.mp4' : 'lesson-32.mp4';
  video.load();

  // Switch subtitle
  document.getElementById('track-zh').mode = (lang === 'zh') ? 'showing' : 'hidden';
  document.getElementById('track-en').mode = (lang === 'en') ? 'showing' : 'hidden';

  currentLang = lang;

  video.addEventListener('loadedmetadata', function resume() {
    video.currentTime = Math.min(savedTime, video.duration - 0.5);
    if (wasPlaying) video.play().catch(()=>{});
    video.removeEventListener('loadedmetadata', resume);
  });
}

// Default Chinese
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('track-zh').mode = 'showing';
  document.getElementById('track-en').mode = 'hidden';
});
</script>
</body>
</html>
